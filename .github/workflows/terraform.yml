name: Terraform IoT Core

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        type: choice
        options:
          - plan
          - apply
          - plan-apply
          - destroy
        default: plan

env:
  AWS_REGION: eu-central-1
  TF_WORKING_DIR: terraform

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for AWS OIDC authentication
      contents: read

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (Access Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: inputs.action == 'plan' || inputs.action == 'plan-apply'
        run: terraform plan -input=false -no-color

      - name: Terraform apply
        if: inputs.action == 'apply' || inputs.action == 'plan-apply'
        run: terraform apply -input=false -auto-approve

      - name: Connect runner to Tailscale
        if: inputs.action == 'apply' || inputs.action == 'plan-apply'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:github-actions

      - name: Set up SSH
        if: inputs.action == 'apply' || inputs.action == 'plan-apply'
        env:
          DEVICE_SSH_PRIVATE_KEY: ${{ secrets.DEVICE_SSH_PRIVATE_KEY }}
          DEVICE_KNOWN_HOSTS: ${{ secrets.DEVICE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEVICE_SSH_PRIVATE_KEY" > ~/.ssh/device_key
          chmod 600 ~/.ssh/device_key
          printf '%s\n' "$DEVICE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy certificates to Raspberry Pi
        if: inputs.action == 'apply' || inputs.action == 'plan-apply'
        env:
          DEVICE_HOST: ${{ secrets.DEVICE_HOST }}
          DEVICE_SSH_USER: ${{ secrets.DEVICE_SSH_USER }}
        run: |
          ssh -i ~/.ssh/device_key \
            -o StrictHostKeyChecking=yes \
            "$DEVICE_SSH_USER@$DEVICE_HOST" \
            'mkdir -p ~/edge-iot/certs && chmod 700 ~/edge-iot/certs'

          scp -i ~/.ssh/device_key \
            -o StrictHostKeyChecking=yes \
            certs/device.pem.crt \
            certs/private.pem.key \
            certs/AmazonRootCA1.pem \
            "$DEVICE_SSH_USER@$DEVICE_HOST:~/edge-iot/certs/"

          ssh -i ~/.ssh/device_key \
            -o StrictHostKeyChecking=yes \
            "$DEVICE_SSH_USER@$DEVICE_HOST" \
            'chmod 600 ~/edge-iot/certs/*'

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve
