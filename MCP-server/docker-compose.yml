version: '3.8'

services:
  iot-mcp-server:
    build: .
    container_name: iot-telemetry-mcp
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AWS_DEFAULT_REGION=eu-central-1
    # Option A: Mount local AWS credentials file from the Pi user home
    volumes:
      - ~/.aws:/root/.aws:ro